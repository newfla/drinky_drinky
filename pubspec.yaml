name: drinky_drinky
description: "A hydration tracking app that helps you meet your daily water goal."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  # Database
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6

  # Navigation
  go_router: ^18.0.0

  # UI Components
  percent_indicator: ^4.2.5
  table_calendar: ^3.2.1

  # Charts
  fl_chart: ^1.2.0

  # Utilities
  collection: ^1.19.1
  shared_preferences: ^2.5.5
  intl: ^0.20.3

  # Theming
  dynamic_color: ^1.9.0

  # Notifications
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  permission_handler: ^13.0.1

  # Data Classes
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.15.0
  drift_dev: ^2.33.0
  riverpod_generator: ^4.0.3
  freezed: ^4.0.0

  # Note: riverpod_lint and custom_lint excluded due to analyzer version
  # conflict with drift_dev 2.33.0 (custom_lint needs analyzer ^8.0.0,
  # drift_dev needs analyzer >=10.0.0). Re-add when versions align.

  # Icon Generation (build-time only)
  flutter_launcher_icons: ^0.14.4
  image: ^4.8.0

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"

  android: true
  min_sdk_android: 26
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_background: "#1565C0"

  ios: true
  remove_alpha_ios: true
  background_color_ios: "#1565C0"
